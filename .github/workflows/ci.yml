# ============================================================================
# NestAI — CI/CD Pipeline (GitHub Actions)
# CI: push/PR to main → lint → test → build check
# CD: push to main only → build → push to Artifact Registry → deploy Cloud Run
# ============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: nestai-production-496015
  GCP_REGION: asia-southeast1
  GAR_REGISTRY: asia-southeast1-docker.pkg.dev/nestai-production-496015/nestai

# ═════════════════════════════════════════════════════════════════════════════
# CI — runs on every push & PR
# ═════════════════════════════════════════════════════════════════════════════
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          SUPABASE_URL: "https://fake.supabase.co"
          SUPABASE_ANON_KEY: "fake-anon-key"
          SUPABASE_SERVICE_KEY: ""
          SECRET_KEY: "ci-test-secret-key"
          OPENAI_API_KEY: "fake"
          GOOGLEMAP_API_KEY: ""
        run: pytest -p no:cacheprovider --tb=short -q

  # ═══════════════════════════════════════════════════════════════════════════
  # CD — only runs on push to main (not PRs)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build backend image
        run: |
          docker build \
            -f src/backend/Dockerfile \
            -t ${{ env.GAR_REGISTRY }}/backend:${{ github.sha }} \
            -t ${{ env.GAR_REGISTRY }}/backend:latest \
            .

      - name: Push backend image
        run: |
          docker push ${{ env.GAR_REGISTRY }}/backend:${{ github.sha }}
          docker push ${{ env.GAR_REGISTRY }}/backend:latest

      # Only deploy the new image — env vars/secrets are managed manually on Cloud Run
      # and inherited automatically by every new revision.
      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy nestai-backend \
            --image ${{ env.GAR_REGISTRY }}/backend:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --quiet

  deploy-bot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build bot-pregnant image
        run: |
          docker build \
            -f src/agents/bot-pregnant/Dockerfile \
            --build-arg HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -t ${{ env.GAR_REGISTRY }}/bot-pregnant:${{ github.sha }} \
            -t ${{ env.GAR_REGISTRY }}/bot-pregnant:latest \
            .

      - name: Push bot-pregnant image
        run: |
          docker push ${{ env.GAR_REGISTRY }}/bot-pregnant:${{ github.sha }}
          docker push ${{ env.GAR_REGISTRY }}/bot-pregnant:latest

      - name: Deploy bot to Cloud Run
        run: |
          gcloud run deploy nestai-bot-pregnant \
            --image ${{ env.GAR_REGISTRY }}/bot-pregnant:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --quiet
