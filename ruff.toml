# ============================================================================
# NestAI — Ruff Linter Configuration
# Docs: https://docs.astral.sh/ruff/configuration/
# ============================================================================

# ─── Target Python version (match Dockerfile) ──────────────────────────────
target-version = "py311"

# ─── Exclude directories ────────────────────────────────────────────────────
exclude = [
    ".venv",
    "venv",
    "node_modules",
    ".git",
    "__pycache__",
    "*.egg-info",
    "dist",
    "build",
    ".next",
]

[lint]
# E = pycodestyle errors, F = pyflakes
# B = flake8-bugbear (common bugs), I = isort (import order)
select = ["E", "F", "B", "I"]

ignore = [
    "E501",   # line-length — fix later with formatter
    "E402",   # module-import-not-at-top — common in scripts/agents
    "E701",   # multiple-statements-on-one-line — one-liners in service code
    "E741",   # ambiguous variable name (l, O, I) — domain-specific
    "B007",   # unused-loop-control-variable — common in enumerate patterns
    "B008",   # function-call-in-default-argument — FastAPI Depends() pattern
    "B904",   # raise-without-from — fix gradually
]

[lint.per-file-ignores]
# __init__.py: allow unused imports (F401) — re-exports
"__init__.py" = ["F401"]
# Tests: allow assert, unused imports (fixtures), redefined names
"**/tests/**" = ["B011", "F401", "F811"]
# Scripts/notebooks: relax import order + unused
"**/scripts/**" = ["E402", "F401", "I001"]
"**/eda_*.py" = ["E402", "F401", "I001"]
# Crawler scripts
"**/crawler/**" = ["E402", "F401", "I001"]

[lint.isort]
known-first-party = ["app", "src"]
